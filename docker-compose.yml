services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: vk-ads-mcp:latest
    container_name: vk-ads-mcp
    restart: unless-stopped
    # Все настройки в .env (см. .env.example):
    #   — VK_ADS_ACCESS_TOKEN                        (вариант A: готовый токен)
    #   — VK_ADS_CLIENT_ID + VK_ADS_CLIENT_SECRET    (вариант B: OAuth client credentials)
    #   — CLICK_RU_TOKEN + CLICK_RU_ACCOUNT_ID       (вариант D: токен через Click.ru)
    #   — MCP_AUTH_TOKEN                             (защита HTTP эндпоинта)
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
      # Coolify-магия: автоматически выдаст FQDN на этот порт через Traefik.
      # Если деплоите не в Coolify — переменная игнорируется.
      SERVICE_FQDN_MCP_3000: /
    # Порт только экспонируется внутри docker-сети — наружу выдаёт reverse-proxy.
    # Для локального запуска раскомментируйте блок ports ниже.
    expose:
      - "3000"
    # ports:
    #   - "${MCP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
